[project]
name = "java-project-manager"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "lxml>=6.1.3",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.2",
    "textual>=8.2.8",
]

[project.scripts]
jpm = "manager.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/manager"]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "isort>=9.0.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "textual-dev>=1.8.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
